version: '3'

services:
  app:
    build: ./app
    ports:
      - "5000:5000"
    networks:
      - monitoring_network
    container_name: devops_app

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring_network
    container_name: prometheus

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring_network
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

  node_exporter:
    image: prom/node-exporter
    ports:
      - "9100:9100"
    networks:
      - monitoring_network
    container_name: node_exporter

  alertmanager:
    image: prom/alertmanager
    ports:
      - "9093:9093"
    networks:
      - monitoring_network
    container_name: alertmanager

networks:
  monitoring_network:
    driver: bridge

